[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimickit-mujoco"
version = "0.1.0"
description = "MimicKit motion imitation for Unitree G1 on native MuJoCo, macOS and Linux"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
dependencies = [
  "mujoco==3.17.0", "torch>=2.6,<3", "numpy>=1.26", "pyyaml>=6",
  "gymnasium>=1", "tensorboardX>=2.6", "matplotlib>=3.8", "moviepy>=2",
  "wandb>=0.17.4", "diffusers>=0.36.0,<0.43", "einops>=0.8", "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
mimickit-mujoco = "mimickit_mujoco.cli:main"

[tool.setuptools.packages.find]
include = ["mimickit*", "tools.diffusion_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*torch.jit.script.*:FutureWarning"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

